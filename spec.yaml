id: individual_patrol

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.1"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  # ICMBio-specific task package, still under active local development —
  # built via `make build` (wd-partner-tasks: BUILD_PKG=icmbio pixi run
  # build-release) into the local channel below, not the published one, so
  # source changes here (extract_formatted_datetime,
  # format_individual_patrol_event_details,
  # prepare_individual_patrol_report_context,
  # generate_individual_patrol_report) take effect on the next
  # `make compile` without needing a release first. Matches
  # ICMBio-patrol_analysis's own local-development commit (switch back to
  # the published channel/version once these tasks are published).
  - name: ecoscope-workflows-ext-icmbio
    version: "*"
    channel: file:///tmp/ecoscope-workflows-custom/release/artifacts/

rjsf-overrides:
  properties:
    patrol_id.properties.var.title: Patrol ID
    patrol_id.properties.var.description: >-
      The patrol to report on, matched against the patrol's serial number
      (the human-facing "ID da patrulha" shown in EarthRanger) — not its
      internal id. Only this one patrol is included in the report.
    patrol_id.properties.var.ecoscope:advanced: false

    Event Style.properties.event_colormap.properties.input_column_name.title: Groupby
    Event Style.properties.event_colormap.properties.input_column_name.description: Color events by the selected attribute. Each unique value is assigned a distinct color on the map.
    Event Style.properties.event_colormap.properties.input_column_name.default: event_type_display
    Event Style.properties.event_colormap.properties.input_column_name.ecoscope:advanced: false
    Event Style.properties.event_colormap.properties.input_column_name.oneOf:
      - const: event_type_display
        title: Event Type
      - const: event_category
        title: Event Category
      - const: serial_number
        title: Event ID
    Event Style.properties.event_colormap.properties.colormap.title: Palette
    Event Style.properties.event_colormap.properties.colormap.description: Choose a color palette. For low-cardinality data (e.g. event type) any palette works; for high-cardinality data (e.g. IDs) use tab20, tab20b, or tab20c to reduce color repetition.
    Event Style.properties.event_colormap.properties.colormap.default: "Set2"
    Event Style.properties.event_colormap.properties.colormap.ecoscope:advanced: false
    Event Style.properties.event_colormap.properties.custom_colors.title: Custom Colors
    Event Style.properties.event_colormap.properties.custom_colors.description: "Leave empty to use the palette above. When provided, these colors are applied instead."
    Event Style.properties.event_colormap.properties.custom_colors.ecoscope:advanced: false
    Event Style.properties.event_legend_title.properties.var.title: Title
    Event Style.properties.event_legend_title.properties.var.description: Legend title for events.
    Event Style.properties.event_legend_title.properties.var.default: Tipo de evento
    Event Style.properties.event_legend_title.properties.var.ecoscope:advanced: false
    Event Style.properties.event_layer.properties.layer_style.properties.get_fill_color.enum: [column_color]
    Event Style.properties.event_layer.properties.layer_style.properties.get_line_color.enum: [column_color]
    Event Style.properties.event_layer.properties.tooltip_columns.default:
      - id
      - serial_number
      - event_type_display
      - time

    Patrol Report.properties.report_template_path.properties.var.title: Template Path
    Patrol Report.properties.report_template_path.properties.var.description: "Path or URL to the .docx Jinja2 template used for the Relatório Patrulha report."
    Patrol Report.properties.report_template_path.properties.var.default: "https://raw.githubusercontent.com/wildlife-dynamics/ICMBio-Individual_patrol/main/resources/templates/relatorio_individual_patrulha_template.docx"
    Patrol Report.properties.report_template_path.properties.var.ecoscope:advanced: false

    download_attachments.properties.skip_download.title: Skip Photo Attachments
    download_attachments.properties.skip_download.description: "If True, skip downloading event photos, and the report will not include any images."
    download_attachments.properties.skip_download.ecoscope:advanced: false

  $defs:
    EarthRangerSource:
      title: EarthRanger
      type: object
      properties:
        query:
          title: Query
          default: null
          anyOf:
            - type: "null"
              title: "--- select ---"
            - $ref: "#/$defs/FeatureSetQuery"
            - $ref: "#/$defs/FeatureTypeQuery"
            - $ref: "#/$defs/FeatureIdQuery"

  uiSchema:
    Spatial Features.spatial_features.source:
      ui:options:
        label: false
    Spatial Features.spatial_features.source.query:
      ui:options:
        label: false
    Spatial Features.spatial_features.source.query.anyOf:
      - ui:options:
          label: false
      - ui:options:
          label: false
      - ui:options:
          label: false
    Event Style.event_layer.layer_style.get_fill_color:
      ui:widget: hidden
    Event Style.event_layer.layer_style.get_line_color:
      ui:widget: hidden
    Event Style.event_layer.layer_style.get_position:
      ui:widget: hidden

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S %Z"

  - id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: Base Maps
    id: base_maps
    task: set_base_maps

  - name: Define Groupers
    id: groupers
    task: set_groupers
    partial:
      groupers: []

  # The one selector that actually scopes this report — everything below
  # is fetched over Time Range, then narrowed down to just this patrol.
  - name: Patrol ID
    id: patrol_id
    task: set_string_var

  - title: Patrol Lookup
    type: task-group
    description: "Fetch every patrol in the time range, then keep only the one matching Patrol ID."
    tasks:
      - id: patrol_and_events_params
        task: set_patrols_and_patrol_events_params
        partial:
          client: ${{ workflow.er_client.return }}
          time_range: ${{ workflow.time_range.return }}
          patrol_types: []
          event_types: []
          sub_page_size: 100
          raise_on_empty: false
          include_patrol_details: true
          truncate_to_time_range: true
          include_null_geometry: false

      - id: all_patrols
        task: get_patrols_from_combined_params
        partial:
          combined_params: ${{ workflow.patrol_and_events_params.return }}

      # `serial_number` is this task's pre-observations column name for
      # the patrol's human-facing ID (it only gets the `extra__patrol_`
      # prefix later, once merged into observations/relocations) —
      # confirmed against a real compile+run. It comes back as an int64
      # column from EarthRanger; filter_row_values' `values` is always
      # list[str] (pydantic-coerced), so isin() would silently match
      # nothing without this cast — confirmed by a real run that hit
      # exactly that (0 rows selected, cascading into every downstream
      # "empty df" skip).
      - id: all_patrols_serial_as_str
        task: convert_column_values_to_string
        partial:
          df: ${{ workflow.all_patrols.return }}
          columns:
            - serial_number

      - id: selected_patrol
        task: filter_row_values
        partial:
          df: ${{ workflow.all_patrols_serial_as_str.return }}
          column: "serial_number"
          values:
            - ${{ workflow.patrol_id.return }}

      # get_patrol_observations_from_patrols_df_and_combined_params
      # validates patrols_df against PatrolsDFSchema, which requires
      # serial_number to stay int64 — cast back after filtering (confirmed
      # by a real run that hit exactly this schema-validation error).
      - id: selected_patrol_serial_as_int
        task: convert_column_values_to_numeric
        partial:
          df: ${{ workflow.selected_patrol.return }}
          columns:
            - serial_number

  - title: Fetch Patrol Data
    type: task-group
    description: "Observations and events belonging only to the selected patrol."
    tasks:
      - id: patrol_observations
        task: get_patrol_observations_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.selected_patrol_serial_as_int.return }}
          combined_params: ${{ workflow.patrol_and_events_params.return }}

      - id: convert_patrols_tz
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.patrol_observations.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns:
            - patrol_start_time
            - patrol_end_time
            - fixtime

      - id: patrol_events
        task: unpack_events_from_patrols_df_and_combined_params
        partial:
          patrols_df: ${{ workflow.selected_patrol_serial_as_int.return }}
          combined_params: ${{ workflow.patrol_and_events_params.return }}

      - id: convert_events_tz
        task: convert_values_to_timezone
        partial:
          df: ${{ workflow.patrol_events.return }}
          timezone: ${{ workflow.get_timezone.return }}
          columns:
            - time
            - patrol_start_time

  - title: Patrol Track
    type: task-group
    description: ""
    tasks:
      - id: relocs
        task: process_relocations
        partial:
          observations: ${{ workflow.convert_patrols_tz.return }}
          relocs_columns:
            - patrol_id
            - patrol_start_time
            - patrol_end_time
            - patrol_type__display
            - patrol_serial_number
            - patrol_subject
            - groupby_col
            - fixtime
            - junk_status
            - geometry
          filter_point_coords:
            - x: 180.000000
              y: 90.000000
            - x: 0.000000
              y: 0.000000
            - x: 1.000000
              y: 1.000000

      - id: trajs
        task: relocations_to_trajectory
        partial:
          relocations: ${{ workflow.relocs.return }}

  - title: Patrol Stat Cards
    type: task-group
    description: "ID da patrulha, Tipo de patrulha, Líder da patrulha, Distância percorrida, Data e hora de início/fim, Participantes."
    tasks:
      # extra__patrol_serial_number comes through as int64 — using the
      # icmbio ext's own extract_first_value_as_string (not
      # dataframe_column_first_unique + convert_column_values_to_string)
      # because the compiled DAG re-validates `trajs`-derived dataframes
      # against their own schema at each task boundary, which coerces a
      # numeric-looking string column straight back to int64 (confirmed
      # by a real run — see that task's docstring).
      - id: patrol_id_stat
        task: ecoscope_workflows_ext_icmbio.tasks.extract_first_value_as_string
        partial:
          df: ${{ workflow.trajs.return }}
          column_name: extra__patrol_serial_number

      - name: ID da patrulha
        id: patrol_id_stat_widget
        task: create_text_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "ID da patrulha"
          data: ${{ workflow.patrol_id_stat.return }}

      - id: patrol_type_stat
        task: ecoscope_workflows_ext_icmbio.tasks.extract_first_value_as_string
        partial:
          df: ${{ workflow.trajs.return }}
          column_name: extra__patrol_type__display

      - name: Tipo de patrulha
        id: patrol_type_stat_widget
        task: create_text_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Tipo de patrulha"
          data: ${{ workflow.patrol_type_stat.return }}

      # NOTE (known limitation, same as ICMBio-patrol_analysis): EarthRanger
      # has no separate "equipe de apoio" (support crew) list — only a
      # single patrol leader/subject. Participantes reuses that same value
      # rather than inventing a crew list; revisit if the partner needs a
      # real multi-person roster.
      - id: patrol_leader_stat
        task: ecoscope_workflows_ext_icmbio.tasks.extract_first_value_as_string
        partial:
          df: ${{ workflow.trajs.return }}
          column_name: extra__patrol_subject

      - name: Líder da patrulha
        id: patrol_leader_stat_widget
        task: create_text_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Líder da patrulha"
          data: ${{ workflow.patrol_leader_stat.return }}

      - name: Participantes
        id: patrol_participants_widget
        task: create_text_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Participantes"
          data: ${{ workflow.patrol_leader_stat.return }}

      - id: total_distance
        task: dataframe_column_sum
        partial:
          df: ${{ workflow.trajs.return }}
          column_name: dist_meters

      - id: total_distance_km
        task: with_unit
        partial:
          original_unit: m
          new_unit: km
          value: ${{ workflow.total_distance.return }}

      - name: Distância percorrida
        id: total_distance_widget
        task: create_single_value_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Distância percorrida (km)"
          decimal_places: 2
          data: ${{ workflow.total_distance_km.return }}

      - id: start_time_str
        task: ecoscope_workflows_ext_icmbio.tasks.extract_formatted_datetime
        partial:
          df: ${{ workflow.trajs.return }}
          column_name: extra__patrol_start_time
          aggregator: min
          time_format: "%d/%m/%Y %H:%M"

      - name: Data e hora de início
        id: start_time_widget
        task: create_text_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Data e hora de início"
          data: ${{ workflow.start_time_str.return }}

      - id: end_time_str
        task: ecoscope_workflows_ext_icmbio.tasks.extract_formatted_datetime
        partial:
          df: ${{ workflow.trajs.return }}
          column_name: extra__patrol_end_time
          aggregator: max
          time_format: "%d/%m/%Y %H:%M"

      - name: Data e hora do fim
        id: end_time_widget
        task: create_text_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Data e hora do fim"
          data: ${{ workflow.end_time_str.return }}

  - title: Spatial Features
    type: task-group
    description: "Optionally overlay any EarthRanger spatial feature layer on the patrol map."
    tasks:
      - id: spatial_features
        task: get_spatial_features
        partial:
          client: ${{ workflow.er_client.return }}

      - id: spatial_features_layer
        task: create_spatial_features_layer
        partial:
          geodataframe: ${{ workflow.spatial_features.return }}
          tooltip_columns: []

  - title: Local Spatial Features
    type: task-group
    description: "Optionally overlay a locally-uploaded spatial file on the patrol map."
    tasks:
      - id: local_spatial_file
        task: load_local_spatial_file

      - id: local_spatial_features_layer
        task: create_spatial_features_layer
        partial:
          geodataframe: ${{ workflow.local_spatial_file.return }}
          tooltip_columns: []

  - title: Map Overlays
    type: task-group
    description: "Optional extra layers shared by the map (Spatial Features, Local Spatial Features)."
    tasks:
      - id: map_overlays
        task: collect_optional_layers
        skipif:
          conditions:
            - never
        partial:
          layers:
            - ${{ workflow.spatial_features_layer.return }}
            - ${{ workflow.local_spatial_features_layer.return }}

  - title: Patrol Track Style
    type: task-group
    description: "A single fixed color for the one patrol track — no legend needed (PRD only asks for an event-type legend)."
    tasks:
      - id: trajs_layer
        task: create_path_layer
        partial:
          geodataframe: ${{ workflow.trajs.return }}
          legend: null
          data_url: null
          layer_style:
            get_color: [37, 99, 235, 255]

  - title: Event Style
    type: task-group
    description: ""
    tasks:
      # unpack_events_from_patrols_df_and_combined_params builds events
      # purely from the patrol's own lightweight embedded segment.events
      # summaries (id, serial_number, event_type, priority, title, state,
      # ...) — confirmed directly against real data (.scripts/debug_events_pipeline.py):
      # there's no `event_details` field there at all, structurally, not
      # just a missing flag. event_type_display is separately absent too.

      # event_type_display: get_event_type_display_names_from_events is the
      # exact core mechanism get_events' own include_display_values=True
      # calls internally (confirmed by reading _earthranger.py's get_events
      # body) — call it directly on our already patrol-scoped events, no
      # extra fetch needed, since it only needs the event_type slug we
      # already have.
      - id: events_with_type_display
        task: get_event_type_display_names_from_events
        partial:
          client: ${{ workflow.er_client.return }}
          events_gdf: ${{ workflow.convert_events_tz.return }}
          append_category_names: duplicates

      # event_details: genuinely requires a real fetch (unpack_events_from_patrols_df
      # never carries it) — a lightweight get_events lookup over the same
      # time range, merged in by id.
      - id: event_details_lookup
        task: get_events
        partial:
          client: ${{ workflow.er_client.return }}
          time_range: ${{ workflow.time_range.return }}
          event_types: []
          event_columns:
            - id
            - time
            - event_type
            - geometry
            - event_details
          include_details: true
          include_display_values: false
          include_null_geometry: true
          include_updates: false
          include_related_events: false
          raise_on_empty: false

      # time/event_type/geometry are only requested above because get_events'
      # output schema requires them — drop everything but the lookup key +
      # the one column actually missing, so it doesn't collide with the
      # real columns already on events_with_type_display.
      - id: event_details_lookup_cols
        task: select_columns
        partial:
          df: ${{ workflow.event_details_lookup.return }}
          raise_on_missing: false
          columns:
            - id
            - event_details

      - id: events_with_display
        task: merge_two_dataframes
        partial:
          left: ${{ workflow.events_with_type_display.return }}
          right: ${{ workflow.event_details_lookup_cols.return }}
          how: "left"
          on: null
          left_on: id
          right_on: id
          left_index: false
          right_index: false
          fillna_value: null

      - id: events_details_resolved
        task: process_events_details
        partial:
          df: ${{ workflow.events_with_display.return }}
          client: ${{ workflow.er_client.return }}
          map_to_titles: true
          ordered: true

      - id: events_with_lat_lon
        task: add_lat_lon_to_gdf
        partial:
          event_gdf: ${{ workflow.events_details_resolved.return }}

      - id: event_colormap
        task: apply_qualitative_color_map
        partial:
          df: ${{ workflow.events_with_lat_lon.return }}

      - id: event_legend_title
        task: set_string_var

      - id: event_layer
        task: create_scatterplot_layer
        partial:
          geodataframe: ${{ workflow.event_colormap.return }}
          legend:
            title: ${{ workflow.event_legend_title.return }}
            label_column: column_label
            color_column: column_color
          data_url: null

  - title: Patrol Map
    type: task-group
    description: "One combined map: the patrol track with its events overlaid, legend by event type."
    tasks:
      - id: map_layers
        task: collect_optional_layers
        skipif:
          conditions:
            - never
        partial:
          layers:
            - ${{ workflow.map_overlays.return }}
            - ${{ workflow.trajs_layer.return }}
            - ${{ workflow.event_layer.return }}

      - id: patrol_map_view_state
        task: view_state_from_layers
        partial:
          layers:
            - ${{ workflow.trajs_layer.return }}
            - ${{ workflow.event_layer.return }}
          max_zoom: 20

      - id: patrol_map
        task: draw_map
        partial:
          geo_layers: ${{ workflow.map_layers.return }}
          tile_layers: ${{ workflow.base_maps.return }}
          static: false
          title: null
          view_state: ${{ workflow.patrol_map_view_state.return }}
          max_zoom: 17
          legend_style:
            placement: bottom-right
          output_type: html

      - id: patrol_map_url
        task: persist_text
        partial:
          text: ${{ workflow.patrol_map.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename: patrol_map.html
          filename_suffix: null

      - name: Mapa da patrulha
        id: patrol_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Mapa da patrulha"
          data: ${{ workflow.patrol_map_url.return }}

      - id: patrol_map_png
        task: html_to_png
        partial:
          html_path: ${{ workflow.patrol_map_url.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          config:
            width: 1280
            height: 720
            full_page: true
            device_scale_factor: 2
            wait_for_timeout: 240000
            timeout: 0
            max_concurrent_pages: 5
            serve_local_files: false

  - title: Eventos Table
    type: task-group
    description: "ID do evento, Tipo de evento, Detalhes do evento (situação do local; tempo estimado da atividade; estruturas observadas; ação tomada)."
    tasks:
      - id: events_detail_formatted
        task: ecoscope_workflows_ext_icmbio.tasks.format_individual_patrol_event_details
        partial:
          df: ${{ workflow.event_colormap.return }}

      - id: events_table
        task: draw_table
        partial:
          dataframe: ${{ workflow.events_detail_formatted.return }}
          columns: null
          table_config: null

      - id: events_table_html
        task: persist_text
        partial:
          text: ${{ workflow.events_table.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: events_table

      - name: Eventos
        id: events_table_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Eventos"
          data: ${{ workflow.events_table_html.return }}

  - title: Registros Fotográficos Table
    type: task-group
    description: "Informações (ID do evento; data e hora; coordenadas geográficas; tipo de evento) — metadata only on the dashboard; the docx report embeds the actual photos."
    tasks:
      - id: photo_records_renamed
        task: map_columns
        partial:
          df: ${{ workflow.event_colormap.return }}
          rename_columns:
            serial_number: "ID do evento"
            time: "Data e hora"
            lat/lon: "Coordenadas geográficas"
            event_type_display: "Tipo de evento"
          raise_if_not_found: false
          retain_columns: null
          drop_columns: null
          duplicate_strategy: suffix

      - id: photo_records_cols
        task: select_columns
        partial:
          df: ${{ workflow.photo_records_renamed.return }}
          raise_on_missing: false
          columns:
            - "ID do evento"
            - "Data e hora"
            - "Coordenadas geográficas"
            - "Tipo de evento"

      - id: photo_records_table
        task: draw_table
        partial:
          dataframe: ${{ workflow.photo_records_cols.return }}
          columns: null
          table_config: null

      - id: photo_records_table_html
        task: persist_text
        partial:
          text: ${{ workflow.photo_records_table.return }}
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: photo_records_table

      - name: Registros Fotográficos
        id: photo_records_widget
        task: create_plot_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Registros Fotográficos"
          data: ${{ workflow.photo_records_table_html.return }}

  - name: Download Event Attachments
    id: download_attachments
    task: download_event_attachments
    partial:
      client: ${{ workflow.er_client.return }}
      event_gdf: ${{ workflow.event_colormap.return }}
      output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      use_index_as_id: false

  - title: Patrol Report
    type: task-group
    description: ""
    tasks:
      - id: report_template_path
        task: set_string_var

      - id: norm_template_path
        task: remove_file_scheme
        partial:
          path: ${{ workflow.report_template_path.return }}

      - id: norm_output_dir
        task: remove_file_scheme
        partial:
          path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

      # skipif: never — a patrol with zero events is a normal, real outcome
      # (matches ICMBio-patrol_analysis's own report_context/generate_report
      # convention), not a reason to drop the whole report.
      - id: report_context
        task: ecoscope_workflows_ext_icmbio.tasks.prepare_individual_patrol_report_context
        skipif:
          conditions:
            - never
        partial:
          patrol_id: ${{ workflow.patrol_id_stat.return }}
          patrol_type: ${{ workflow.patrol_type_stat.return }}
          patrol_leader: ${{ workflow.patrol_leader_stat.return }}
          start_time: ${{ workflow.start_time_str.return }}
          end_time: ${{ workflow.end_time_str.return }}
          total_distance_km: ${{ workflow.total_distance_km.return }}
          events: ${{ workflow.events_detail_formatted.return }}

      - id: individual_patrol_report
        task: ecoscope_workflows_ext_icmbio.tasks.generate_individual_patrol_report
        skipif:
          conditions:
            - never
        partial:
          context: ${{ workflow.report_context.return }}
          template_path: ${{ workflow.norm_template_path.return }}
          patrol_map_png: ${{ workflow.patrol_map_png.return }}
          photo_attachment_paths: ${{ workflow.download_attachments.return }}
          photo_events: ${{ workflow.event_colormap.return }}
          output_dir: ${{ workflow.norm_output_dir.return }}

  - name: Dashboard
    id: dashboard
    task: gather_icmbio_dashboard
    partial:
      details: ${{ workflow.workflow_details.return }}
      widgets:
        - ${{ workflow.patrol_id_stat_widget.return }}
        - ${{ workflow.patrol_type_stat_widget.return }}
        - ${{ workflow.patrol_leader_stat_widget.return }}
        - ${{ workflow.patrol_participants_widget.return }}
        - ${{ workflow.total_distance_widget.return }}
        - ${{ workflow.start_time_widget.return }}
        - ${{ workflow.end_time_widget.return }}
        - ${{ workflow.patrol_map_widget.return }}
        - ${{ workflow.events_table_widget.return }}
        - ${{ workflow.photo_records_widget.return }}
      groupers: ${{ workflow.groupers.return }}
      time_range: ${{ workflow.time_range.return }}
